name: Update venues

on:
  schedule:
    # Every Monday at 13:00 UTC (~8am Central). Edit the cron to change frequency.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY secret is not set - skipping the refresh."
            echo "Add it under Settings > Secrets and variables > Actions to enable weekly updates."
            exit 0
          fi
          python3 update_venues.py
          python3 check_data.py   # fail before a bad hand edit gets baked into index.html
          python3 build.py        # bake the fresh data into index.html for the offline copy

      - name: Commit changes if any
        run: |
          git config user.name "naper-kids-bot"
          git config user.email "actions@users.noreply.github.com"
          git add venues.json index.html
          git diff --cached --quiet || git commit -m "Auto-update venues.json and rebuild index.html"
          git push
